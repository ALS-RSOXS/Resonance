site_name: "als-rsoxs: resonance"
site_description: ALS-RSOXS beamline control toolkit for typed device access, scan orchestration, and MCP integration
site_url: https://als-rsoxs.github.io/Resonance/
repo_url: https://github.com/als-rsoxs/Resonance
repo_name: als-rsoxs/Resonance
edit_uri: edit/main/docs/

extra:
  als_group:
    full_name: ALS RSOXS Group Project
    acronym: REIXS
    github_url: https://github.com/als-rsoxs
    reixs_url: https://als.lbl.gov/science/photon-science-programs/rixs-program/

theme:
  name: rsoxs
  show_title: true
  show_stargazers: true
  topbar_sections: false
  katex_options: {}
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - content.code.copy
    - content.code.annotate
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - toc.follow

plugins:
  - rsoxs
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            show_source: true
            show_root_heading: true
            show_root_toc_entry: true
            docstring_style: numpy
            merge_init_into_class: true

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

nav:
  - Home: index.md
  - Beamline:
      - "Layout and geometry":
          - Overview: beamline/index.md
          - "Optical path": beamline/optical-path.md
          - "Sample and detector geometry": beamline/sample-and-detector-geometry.md
      - "Controls and sensing":
          - Motors: beamline/motors.md
          - "Analog inputs": beamline/analog-inputs.md
          - "Digital I/O": beamline/digital-io.md
          - "Area detector": beamline/area-detector.md
  - User Guide:
      - Guides:
          - Installation: user_guide/installation.md
          - "Quick Start": user_guide/quickstart.md
  - API Reference:
      - Overview: api.md
      - Resonance API:
          - Overview: api-reference/resonance-api/index.md
          - Types: api-reference/resonance-api/types.md
          - Header Map: api-reference/resonance-api/header_map.md
          - Utils: api-reference/resonance-api/utils.md
          - Validation: api-reference/resonance-api/validation.md
          - Core:
              - AI Accessor: api-reference/resonance-api/core/ai.md
              - Beamline: api-reference/resonance-api/core/beamline.md
              - Detector: api-reference/resonance-api/core/det.md
              - DIO Accessor: api-reference/resonance-api/core/dio.md
              - Motor Accessor: api-reference/resonance-api/core/motors.md
              - Primitives: api-reference/resonance-api/core/primitives.md
              - Scan: api-reference/resonance-api/core/scan.md
          - Data:
              - Catalog: api-reference/resonance-api/data/catalog.md
              - Compression: api-reference/resonance-api/data/compression.md
              - Models: api-reference/resonance-api/data/models.md
              - Schema: api-reference/resonance-api/data/schema.md
              - Writer: api-reference/resonance-api/data/writer.md
      - MCP:
          - Overview: api-reference/mcp/index.md
          - Connection: api-reference/mcp/connection.md
          - Models: api-reference/mcp/models.md
          - Server: api-reference/mcp/server.md
          - Main Entrypoint: api-reference/mcp/main.md
          - Tools:
              - AI Tools: api-reference/mcp/tools/ai_tools.md
              - DIO Tools: api-reference/mcp/tools/dio_tools.md
              - Motor Tools: api-reference/mcp/tools/motor_tools.md
  - Examples:
      - "Example workflows":
          - "Grid scan": examples/grid_scan.md
          - "Run writer": examples/run_writer.md
  - Contributing: contributing.md
