site_name: "als-rsoxs: resonance"
site_description: ALS-RSOXS beamline control toolkit for typed device access, scan orchestration, and MCP integration
site_url: https://als-rsoxs.github.io/auto-reflect/
repo_url: https://github.com/ALS-RSOXS/auto-reflect
repo_name: ALS-RSOXS/auto-reflect
edit_uri: edit/main/docs/

theme:
  name: material
  logo: assets/als-logo.png
  favicon: assets/als-favicon-32x32.png
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - content.code.copy
    - content.code.annotate
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - toc.follow

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            show_source: true
            show_root_heading: true
            show_root_toc_entry: true
            docstring_style: numpy
            merge_init_into_class: true

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

extra_css:
  - stylesheets/als.css

nav:
  - Home: index.md
  - Beamline:
      - Overview: beamline/index.md
      - Optical path: beamline/optical-path.md
      - Sample and detector geometry: beamline/sample-and-detector-geometry.md
      - Motors: beamline/motors.md
      - Analog inputs: beamline/analog-inputs.md
      - Digital I/O: beamline/digital-io.md
      - Area detector: beamline/area-detector.md
  - User Guide:
      - Installation: user_guide/installation.md
      - Quick Start: user_guide/quickstart.md
  - API Reference: api.md
  - Examples:
      - Grid Scan: examples/grid_scan.md
      - Run Writer: examples/run_writer.md
  - Contributing: contributing.md
